<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture du cours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mada:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #00afa9;
            --primary-light: #cce1e1;
            --primary-dark: #096475;
            --secondary-purple: #7200a9;
            --secondary-orange: #ffa900;
            --gray: #808284;
            --gray-light: #f5f7f8;
            --gray-dark: #4a4a4a;
            --white: #ffffff;
            --error: #e74c3c;
            --success: #27ae60;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Mada', sans-serif;
            background: var(--gray-light);
            color: var(--gray-dark);
            line-height: 1.6;
        }
        .topbar {
            background: var(--white);
            box-shadow: var(--shadow);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar a {
            text-decoration: none;
            color: var(--primary-dark);
            font-weight: 700;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .course-header {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: var(--white);
            padding: 40px;
            border-radius: var(--radius);
            margin-bottom: 30px;
            text-align: center;
        }
        .course-header h1 { font-size: 2rem; font-weight: 900; }
        .module-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 25px;
        }
        .module-card h2 {
            color: var(--primary-dark);
            margin-bottom: 15px;
            font-size: 1.4rem;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .quiz-question {
            margin-bottom: 20px;
        }
        .quiz-option {
            display: block;
            background: var(--gray-light);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .quiz-option:hover { border-color: var(--primary); }
        .quiz-option input { margin-right: 10px; }
        button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.3s;
        }
        button:hover { transform: translateY(-2px); }
        .btn-secondary {
            background: var(--white);
            color: var(--primary-dark);
            border: 2px solid var(--primary);
        }
        .btn-secondary:hover { background: var(--primary-light); }
        .result {
            margin-top: 15px;
            font-weight: 700;
            color: var(--primary-dark);
        }
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .error-message {
            background: var(--error);
            color: white;
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gray);
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="index.html">← Retour à la plateforme</a>
        <span>FormPro</span>
    </header>

    <main class="container">
        <div id="courseContent"><div class="loading">Chargement du cours...</div></div>
    </main>

    <script>
        // ============================================
        // CONFIGURATION SUPABASE
        // ============================================
        const SUPABASE_URL = "https://txdvluhigwkyrduqxmyr.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4ZHZsdWhpZ3dreXJkdXF4bXlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMTYzMzEsImV4cCI6MjEwMjg5MjMzMX0.waXh6ptcSMocNPJMbF36IPGIH4E-EGdTvj9NwGoiSV0";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================
        // LECTEUR DE COURS
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = parseInt(urlParams.get('id'));

        let course = null;
        let modules = [];

        async function loadCourse() {
            if (!courseId) {
                document.getElementById('courseContent').innerHTML = '<div class="error-message">Aucun cours spécifié.</div>';
                return;
            }

            const { data, error } = await supabaseClient
                .from('courses')
                .select('*')
                .eq('id', courseId)
                .single();

            if (error || !data) {
                console.error('Erreur chargement cours:', error);
                document.getElementById('courseContent').innerHTML = '<div class="error-message">Cours introuvable.</div>';
                return;
            }

            course = data;
            modules = course.modules || [];
            renderCourse();
        }

        function renderCourse() {
            const container = document.getElementById('courseContent');

            let html = `
                <div class="course-header">
                    <h1>${course.title}</h1>
                    <p>${course.description}</p>
                </div>
            `;

            if (modules && modules.length > 0) {
                modules.forEach((module, index) => {
                    html += renderModule(module, index);
                });
            } else {
                html += `<div class="module-card"><p>Ce cours ne contient pas encore de contenu interactif.</p></div>`;
            }

            html += `
                <div class="module-card">
                    <div class="actions">
                        <a href="index.html#catalogue" class="btn-secondary" style="text-decoration:none; padding: 12px 25px; border-radius:8px;">Retour au catalogue</a>
                        <button id="btnFinishCourse">Terminer le cours</button>
                    </div>
                </div>
            `;

            container.innerHTML = html;

            document.getElementById('btnFinishCourse').addEventListener('click', finishCourse);
        }

        function renderModule(module, index) {
            let moduleHtml = `<div class="module-card">`;

            if (module.type === 'section') {
                moduleHtml += `<h2>${module.title || 'Section'}</h2>`;
                moduleHtml += module.content ? `<p>${module.content}</p>` : `<p>Aucun contenu pour cette section.</p>`;
            } else if (module.type === 'video') {
                moduleHtml += `<h2>Vidéo</h2>`;
                if (module.url && module.url.includes('embed')) {
                    moduleHtml += `<div class="video-container"><iframe src="${module.url}" allowfullscreen></iframe></div>`;
                } else if (module.url) {
                    moduleHtml += `<p>Lien vidéo : <a href="${module.url}" target="_blank">${module.url}</a></p>`;
                } else {
                    moduleHtml += `<p>Aucune vidéo fournie.</p>`;
                }
            } else if (module.type === 'quiz') {
                moduleHtml += `<h2>Quiz</h2>`;
                moduleHtml += renderQuiz(module.questions, index);
            }

            moduleHtml += `</div>`;
            return moduleHtml;
        }

        function renderQuiz(questions, moduleIndex) {
            if (!questions || questions.length === 0) {
                return `<p>Aucun quiz.</p>`;
            }

            let quizHtml = '';
            questions.forEach((q, qIndex) => {
                quizHtml += `<div class="quiz-question"><p><strong>${qIndex + 1}. ${q.question}</strong></p>`;

                if (q.type === 'text') {
                    quizHtml += `<input type="text" class="text-answer" data-module="${moduleIndex}" data-question="${qIndex}" placeholder="Votre réponse" style="width:100%; padding:10px;">`;
                } else if (q.type === 'qcm_single') {
                    q.options.forEach((opt, optIndex) => {
                        quizHtml += `<label class="quiz-option"><input type="radio" name="quiz-${moduleIndex}-${qIndex}" value="${optIndex}"> ${opt}</label>`;
                    });
                } else if (q.type === 'qcm_multiple') {
                    q.options.forEach((opt, optIndex) => {
                        quizHtml += `<label class="quiz-option"><input type="checkbox" name="quiz-${moduleIndex}-${qIndex}" value="${optIndex}"> ${opt}</label>`;
                    });
                }

                quizHtml += `</div>`;
            });

            quizHtml += `<button class="btn" onclick="validateQuiz(${moduleIndex})">Valider le quiz</button>`;
            quizHtml += `<p class="result" id="quiz-result-${moduleIndex}"></p>`;

            return quizHtml;
        }

        function validateQuiz(moduleIndex) {
            const module = modules[moduleIndex];
            if (!module || module.type !== 'quiz') return;

            const questions = module.questions;
            let score = 0;
            let total = questions.length;

            questions.forEach((q, qIndex) => {
                if (q.type === 'text') {
                    const input = document.querySelector(`.text-answer[data-module="${moduleIndex}"][data-question="${qIndex}"]`);
                    if (input && q.correct && input.value.trim().toLowerCase() === q.correct.toString().toLowerCase()) {
                        score++;
                    }
                } else if (q.type === 'qcm_single') {
                    const selected = document.querySelector(`input[name="quiz-${moduleIndex}-${qIndex}"]:checked`);
                    if (selected && parseInt(selected.value) === parseInt(q.correct)) {
                        score++;
                    }
                } else if (q.type === 'qcm_multiple') {
                    const selected = document.querySelectorAll(`input[name="quiz-${moduleIndex}-${qIndex}"]:checked`);
                    const selectedIndexes = Array.from(selected).map(el => parseInt(el.value)).sort();
                    const correctIndexes = Array.isArray(q.correct) ? q.correct.map(i => parseInt(i)).sort() : [];
                    if (JSON.stringify(selectedIndexes) === JSON.stringify(correctIndexes)) {
                        score++;
                    }
                }
            });

            const percent = Math.round((score / total) * 100);
            document.getElementById(`quiz-result-${moduleIndex}`).textContent = `Score : ${score}/${total} (${percent}%)`;
        }

        async function finishCourse() {
            const sessionUser = JSON.parse(localStorage.getItem('sessionUser') || 'null');
            if (!sessionUser) {
                alert('Vous devez être connecté pour enregistrer votre progression.');
                return;
            }

            const { error } = await supabaseClient
                .from('progress')
                .upsert({
                    user_id: sessionUser.username,
                    course_id: courseId,
                    completed: true,
                    score: 100,
                    completed_at: new Date().toISOString()
                }, { onConflict: 'user_id,course_id' });

            if (error) {
                console.error('Erreur enregistrement progression:', error);
                alert('Erreur lors de l\'enregistrement : ' + error.message);
                return;
            }

            alert('Cours terminé ! Votre progression a été enregistrée.');
            window.location.href = 'index.html#catalogue';
        }

        loadCourse();
    </script>
</body>
</html>

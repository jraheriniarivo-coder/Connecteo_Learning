<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGPD & Protection des données — Module interactif</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mada:wght@400;500;600;700;800&display=swap');

  /* Palette officielle Connecteo (guide de marque) — aucune couleur hors charte */
  :root{
    --navy:#096475;      /* Bleu Saphire — primaire */
    --navy-soft:#074E5C; /* Bleu Saphire assombri, hover */
    --teal:#00AFA9;      /* Bleu Tiffany — primaire, accent CTA */
    --teal-soft:#DFF5F4; /* Bleu Tiffany, teinte claire */
    --amber:#FFA900;     /* Jaune Chrome — primaire, alerte */
    --amber-soft:#FFF3DC;
    --violet:#7200A9;    /* Violet chinois — primaire, accent */
    --green:#78844A;     /* Vert Olive — secondaire, sert d'indicateur "correct" */
    --green-soft:#EEF1E5;
    --wrong:#C0392B;     /* Rouge — autorisé explicitement par Aro pour l'indicateur d'erreur */
    --wrong-soft:#FBE9E7;
    --paper:#F2ECE5;     /* Beige — tertiaire, fond */
    --ink:#096475;        /* texte principal : Bleu Saphire (pas de noir dans la charte) */
    --ink-soft:#657C8A;   /* Gris Bleu — secondaire, texte atténué */
    --line:#CCE1E1;       /* Bleu pâle — tertiaire, séparateurs */
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Mada',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Mada',sans-serif; font-weight:700;}

  #app{
    width:100%;
    max-width:1280px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* Header */
  header{
    background:var(--navy);
    color:#fff;
    padding:20px 56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Mada',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.02em;
  }
  .brand-mark{
    width:40px;height:40px;border-radius:9px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    padding:4px;
    flex-shrink:0;
  }
  .brand-mark svg{ display:block; width:100%; height:100%; }
  .headline{font-size:13px;color:#B9C4D6;font-weight:500;}
  .timer{
    display:flex;
    align-items:center;
    gap:7px;
    background:rgba(255,255,255,0.12);
    border-radius:20px;
    padding:7px 14px;
    font-weight:700;
    font-size:14px;
    letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
  }
  .timer.warn{background:var(--amber); color:var(--navy);}

  .read-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--teal-soft);
    color:var(--navy);
    font-size:12.5px;
    font-weight:600;
    padding:5px 12px;
    border-radius:20px;
    margin-bottom:14px;
  }
  .q-timer{
    background:var(--paper);
    border:1.5px solid var(--line);
    color:var(--navy);
    font-weight:700;
    font-size:13px;
    padding:6px 12px;
    border-radius:20px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .q-timer.warn{background:var(--amber-soft); border-color:var(--amber); color:#7A4A15;}

  /* Progress rail */
  .rail{
    display:flex;
    gap:6px;
    padding:16px 56px;
    background:#fff;
    border-bottom:1px solid var(--line);
  }
  .rail-seg{
    flex:1;
    height:5px;
    border-radius:3px;
    background:var(--line);
    overflow:hidden;
    position:relative;
  }
  .rail-seg .fill{
    position:absolute;top:0;left:0;height:100%;width:0%;
    background:var(--teal);
    transition:width .35s ease;
  }
  .rail-labels{
    display:flex;
    justify-content:space-between;
    padding:0 56px 14px 56px;
    background:#fff;
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
    letter-spacing:.02em;
    text-transform:uppercase;
  }

  main{
    flex:1;
    padding:48px 56px 36px 56px;
    display:flex;
    flex-direction:column;
  }

  .scene{
    animation:enter .38s ease;
    max-width:880px;
  }
  @keyframes enter{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:10px;
  }
  .eyebrow .num{
    background:var(--teal);
    color:#fff;
    width:20px;height:20px;
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
  }
  h1.scene-title{
    font-size:32px;
    font-weight:700;
    color:var(--navy);
    margin:0 0 20px 0;
    line-height:1.2;
  }
  .lede{
    font-size:17.5px;
    line-height:1.65;
    color:var(--ink);
    margin-bottom:24px;
  }

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 24px;
  }

  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}

  .item{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:12px;
  }
  .item-title{
    font-weight:700;
    font-size:14.5px;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .item-body{font-size:14px;color:var(--ink-soft);line-height:1.55;}

  .do{border-left:4px solid var(--green);}
  .do .item-title{color:var(--green);}
  .dont{border-left:4px solid var(--wrong);}
  .dont .item-title{color:var(--wrong);}
  .warn{background:var(--amber-soft); border:1px solid #EAD2AE; border-radius:var(--radius); padding:16px 18px; font-size:14px; color:#7A4A15; line-height:1.55;}

  .quote{
    background:var(--teal-soft);
    border-radius:var(--radius);
    padding:14px 18px;
    font-size:14px;
    color:#0F4C46;
    font-style:italic;
    margin-top:8px;
  }
  .quote b{font-style:normal;}

  .steps{counter-reset:step;}
  .step{
    display:flex;
    gap:14px;
    margin-bottom:14px;
  }
  .step-num{
    counter-increment:step;
    flex-shrink:0;
    width:30px;height:30px;
    border-radius:50%;
    background:var(--navy);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
    font-size:13px;
  }
  .step-body b{display:block;font-size:14.5px;margin-bottom:2px;}
  .step-body span{font-size:13.5px;color:var(--ink-soft);}

  /* Quiz */
  .quiz-tag{
    display:inline-block;
    background:var(--navy);
    color:#fff;
    font-size:11px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:14px;
  }
  .quiz-q{
    font-size:19px;
    font-weight:700;
    color:var(--navy);
    margin-bottom:18px;
    line-height:1.35;
  }
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:13px 16px;
    font-size:14.5px;
    font-family:'Mada',sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    transition:border-color .15s, background .15s;
  }
  .opt:hover:not(:disabled){border-color:var(--teal);}
  .opt-letter{
    width:24px;height:24px;border-radius:7px;
    background:var(--paper);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--ink-soft);
    flex-shrink:0;
  }
  .opt.selected{border-color:var(--teal); background:var(--teal-soft);}
  .opt.selected .opt-letter{background:var(--teal); color:#fff; border-color:var(--teal);}
  .opt.correct{border-color:var(--green); background:var(--green-soft);}
  .opt.correct .opt-letter{background:var(--green); color:#fff; border-color:var(--green);}
  .opt.wrong{border-color:var(--wrong); background:var(--wrong-soft);}
  .opt.wrong .opt-letter{background:var(--wrong); color:#fff; border-color:var(--wrong);}
  .opt:disabled{cursor:default;}

  .opt-check{
    width:20px;height:20px;border-radius:5px;
    background:#fff;
    border:2px solid var(--line);
    flex-shrink:0;
    position:relative;
  }
  .opt.selected .opt-check{background:var(--teal); border-color:var(--teal);}
  .opt.selected .opt-check::after{content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700;}
  .opt.correct .opt-check{background:var(--green); border-color:var(--green);}
  .opt.correct .opt-check::after{content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700;}
  .opt.wrong .opt-check{background:var(--wrong); border-color:var(--wrong);}
  .opt.wrong .opt-check::after{content:'✕'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700;}

  .feedback{
    margin-top:16px;
    padding:14px 16px;
    border-radius:12px;
    font-size:14px;
    line-height:1.55;
    display:none;
  }
  .feedback.show{display:block; animation:enter .3s ease;}
  .feedback.ok{background:var(--green-soft); color:#1E5B3B;}
  .feedback.ko{background:var(--wrong-soft); color:#7C2A20;}

  /* Section intro / recap screens */
  .center-scene{
    text-align:center;
    max-width:560px;
    margin:20px auto 0 auto;
  }
  .icon-badge{
    width:64px;height:64px;
    border-radius:18px;
    background:var(--navy);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    margin:0 auto 20px auto;
  }

  .score-ring{
    width:150px;height:150px;
    border-radius:50%;
    margin:10px auto 22px auto;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    background:conic-gradient(var(--teal) calc(var(--pct,0)*1%), var(--line) 0);
  }
  .score-ring-inner{
    width:118px;height:118px;
    border-radius:50%;
    background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .score-ring-inner .big{font-size:28px;font-weight:700;font-family:'Mada',sans-serif;color:var(--navy);}
  .score-ring-inner .small{font-size:11px;color:var(--ink-soft);}

  .recap-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    font-size:14px;
    text-align:left;
  }
  .recap-row:last-child{border-bottom:none;}
  .pill{
    font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:20px;
  }
  .pill.ok{background:var(--green-soft); color:#1E5B3B;}
  .pill.ko{background:var(--wrong-soft); color:#7C2A20;}

  /* Footer nav */
  footer{
    padding:20px 56px 30px 56px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff;
    border-top:1px solid var(--line);
  }
  .btn{
    font-family:'Mada',sans-serif;
    font-weight:700;
    font-size:14px;
    border:none;
    border-radius:10px;
    padding:12px 22px;
    cursor:pointer;
    display:flex;align-items:center;gap:8px;
  }
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:hover{background:var(--navy-soft);}
  .btn-primary:disabled{background:#C7CCD5; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--ink); border-color:var(--ink-soft);}
  .step-count{font-size:12.5px; color:var(--ink-soft); font-weight:600;}

  :focus-visible{outline:3px solid var(--teal); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    .scene, .feedback.show{animation:none;}
    .rail-seg .fill{transition:none;}
  }
</style>
</head>

/* ---------- MOTEUR ---------- */
let idx = 0;
const answers = {}; // sceneIndex -> {correct:bool}
let attemptNumber = 1; // 1 = premier passage, 2 = tentative de rattrapage (dernière)
const MAX_ATTEMPTS = 2;
const PASS_THRESHOLD = 80; // seuil de réussite (certificat + fin des tentatives de rattrapage)
let participantIdentity = null; // renseigné en tout début de parcours, réutilisé jusqu'au bilan

function isValidMatricule(m){
  return /^(CN|CI|CS)/i.test(m) && m.length>=7;
}

const mainEl = document.getElementById('main');
const railEl = document.getElementById('rail');
const railLabelsEl = document.getElementById('railLabels');
const btnBack = document.getElementById('btnBack');
const btnNext = document.getElementById('btnNext');
const stepCount = document.getElementById('stepCount');

function buildRail(){
  railEl.innerHTML = '';
  railLabelsEl.innerHTML = '';
  SECTIONS.forEach((label,i)=>{
    const seg = document.createElement('div');
    seg.className='rail-seg';
    seg.innerHTML = '<div class="fill" id="fill-'+i+'"></div>';
    railEl.appendChild(seg);
    const lab = document.createElement('span');
    lab.textContent = label;
    railLabelsEl.appendChild(lab);
  });
}
buildRail();

/* Estimation des temps — plus de chronomètre global bloquant.
   Hypothèses posées (ajustables en une ligne si besoin) :
   - Vitesse de lecture retenue : 130 mots/minute (rythme "lecture attentive", pas de la lecture rapide)
   - Temps alloué par question de quiz : 3 minutes (dans la fourchette 2-3 min demandée) */
const READING_WPM = 130;
const QUIZ_SECONDS_PER_Q = 180;

function wordCount(html){
  const text = (html||'').replace(/<[^>]*>/g,' ').replace(/&[a-zA-Z]+;/g,' ');
  return text.trim().split(/\s+/).filter(Boolean).length;
}
scenes.forEach(s=>{
  if(s.type==='content'){
    const words = wordCount(s.body) + wordCount(s.card);
    s.readMinutes = Math.max(1, Math.ceil(words/READING_WPM));
  }
});
const totalQuizCount = scenes.filter(s=>s.type==='quiz').length;
const totalReadingMinutes = scenes.filter(s=>s.type==='content').reduce((a,s)=>a+s.readMinutes,0);
const totalQuizMinutes = Math.ceil(totalQuizCount * QUIZ_SECONDS_PER_Q / 60);
const totalEstimateMinutes = totalReadingMinutes + totalQuizMinutes;

const timerEl = document.getElementById('timer');
timerEl.textContent = '🎯 Durée estimée : '+totalEstimateMinutes+' min';

/* Chronomètre principal — temps total écoulé depuis le début du module (compte, ne bloque pas).
   S'arrête automatiquement une fois le bilan final atteint. */
let moduleStartTime = Date.now();
let moduleTimerHandle = null;
const elapsedTimerEl = document.getElementById('elapsedTimer');
function tickElapsed(){
  const s = Math.floor((Date.now()-moduleStartTime)/1000);
  const m = Math.floor(s/60), sec = s%60;
  elapsedTimerEl.textContent = '⏱ '+(m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}
function startModuleTimer(){
  if(moduleTimerHandle) return;
  tickElapsed();
  moduleTimerHandle = setInterval(tickElapsed, 1000);
}
function stopModuleTimer(){
  if(moduleTimerHandle){ clearInterval(moduleTimerHandle); moduleTimerHandle = null; }
  tickElapsed(); // fige l'affichage sur la dernière valeur
}
startModuleTimer();

/* Suivi du temps passé par écran (pour repérer les points de blocage potentiels) */
const sceneTimeSpent = {}; // sceneIndex -> secondes cumulées
let sceneEnterTimestamp = Date.now();
let lastLoggedIdx = null;
function flushSceneTime(){
  if(lastLoggedIdx===null) return;
  const spent = (Date.now()-sceneEnterTimestamp)/1000;
  sceneTimeSpent[lastLoggedIdx] = (sceneTimeSpent[lastLoggedIdx]||0) + spent;
  sceneEnterTimestamp = Date.now();
}
function buildBlockagePointsSummary(){
  const blocages = [];
  const detail = [];
  scenes.forEach((s,i)=>{
    if(s.type==='content'){
      const actual = Math.round(sceneTimeSpent[i]||0);
      const estimated = s.readMinutes*60;
      const label = s.eyebrow+' — '+s.title;
      detail.push({ecran:label, tempsEstimeSec:estimated, tempsReelSec:actual, depasse: actual>estimated});
      if(actual>estimated) blocages.push(label+' ('+actual+'s passées vs '+estimated+'s estimées)');
    }
  });
  return {
    pointsDeBlocage: blocages.length ? blocages.join(' | ') : 'Aucun point de blocage détecté',
    detailJSON: JSON.stringify(detail)
  };
}

/* Minuteur par question — basé sur une échéance fixe (et non un compteur qu'on relance),
   pour qu'aller/venir avec Précédent/Suivant ne redonne jamais du temps frais.
   Si le temps est dépassé, la question est comptabilisée comme incorrecte. */
let quizTimerHandle = null;
const quizDeadline = {}; // sceneIndex -> timestamp d'échéance (ms)

function triggerQuizTimeout(container, questionIdx){
  if(answers[questionIdx]!==undefined) return; // déjà répondu entre-temps
  answers[questionIdx] = {picked:null, correct:false, timedOut:true};
  showQuizResult(container, scenes[questionIdx], null);
  const fb = container.querySelector('#fb');
  if(fb){ fb.className = 'feedback show ko'; fb.textContent = 'Temps imparti dépassé pour cette question — comptabilisée comme incorrecte.'; }
  const btnValidate = container.querySelector('#btnValidate');
  if(btnValidate) btnValidate.style.display='none';
  const qTimerEl = container.querySelector('#qTimer');
  if(qTimerEl) qTimerEl.textContent = '⏳ Temps écoulé';
  updateFooter();
}

function startQuizTimer(container){
  if(quizTimerHandle) clearInterval(quizTimerHandle);
  const questionIdx = idx;
  if(!quizDeadline[questionIdx]){
    quizDeadline[questionIdx] = Date.now() + QUIZ_SECONDS_PER_Q*1000;
  }
  const el = container.querySelector('#qTimer');
  if(!el) return;

  function tick(){
    const left = Math.ceil((quizDeadline[questionIdx]-Date.now())/1000);
    if(left<=0){
      clearInterval(quizTimerHandle);
      triggerQuizTimeout(container, questionIdx);
      return;
    }
    const m = Math.floor(left/60), sec = left%60;
    el.textContent = '⏳ '+(m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
    el.classList.toggle('warn', left<=30);
  }
  tick(); // vérifie/affiche immédiatement (couvre le cas où l'échéance a expiré pendant l'absence)
  if(answers[questionIdx]===undefined){
    quizTimerHandle = setInterval(tick, 1000);
  }
}
function stopQuizTimer(){
  if(quizTimerHandle){ clearInterval(quizTimerHandle); quizTimerHandle = null; }
}

/* Sauvegarde de progression — pour qu'un rafraîchissement accidentel reprenne
   là où le participant s'était arrêté plutôt que de tout remettre à zéro.
   Portée : le temps que l'onglet reste ouvert (sessionStorage), pas au-delà. */
const PROGRESS_KEY = 'rgpd_module_progress_v1';
let moduleClosed = false;
function saveProgress(){
  try{
    const state = { idx, answers, attemptNumber, participantIdentity, quizDeadline, sceneTimeSpent, moduleStartTime };
    sessionStorage.setItem(PROGRESS_KEY, JSON.stringify(state));
  }catch(e){ /* stockage indisponible (ex. navigation privée stricte) — on continue sans sauvegarde */ }
}
function loadProgress(){
  try{
    const raw = sessionStorage.getItem(PROGRESS_KEY);
    if(!raw) return false;
    const state = JSON.parse(raw);
    idx = state.idx || 0;
    Object.assign(answers, state.answers || {});
    attemptNumber = state.attemptNumber || 1;
    participantIdentity = state.participantIdentity || null;
    Object.assign(quizDeadline, state.quizDeadline || {});
    Object.assign(sceneTimeSpent, state.sceneTimeSpent || {});
    if(state.moduleStartTime) moduleStartTime = state.moduleStartTime;
    return true;
  }catch(e){ return false; }
}
function clearProgress(){
  try{ sessionStorage.removeItem(PROGRESS_KEY); }catch(e){}
}
window.addEventListener('beforeunload', function(e){
  if(moduleClosed) return;
  if(idx>0){ e.preventDefault(); e.returnValue=''; }
});

function currentSectionIndex(){
  const s = scenes[idx];
  if(s.type==='intro'||s.type==='identity') return 0;
  if(s.type==='recap') return SECTIONS.length-1;
  return s.section;
}
function updateRail(){
  const secTotals = {};
  const secDone = {};
  scenes.forEach((s,i)=>{
    if(s.type==='content'||s.type==='quiz'){
      secTotals[s.section] = (secTotals[s.section]||0)+1;
      if(i<=idx) secDone[s.section] = (secDone[s.section]||0)+1;
    }
  });
  for(let i=0;i<SECTIONS.length;i++){
    const fill = document.getElementById('fill-'+i);
    if(!fill) continue;
    let pct = 0;
    const curSec = currentSectionIndex();
    if(i<curSec) pct = 100;
    else if(i===curSec) pct = secTotals[i] ? Math.round((secDone[i]||0)/secTotals[i]*100) : (scenes[idx].type==='intro'||scenes[idx].type==='identity'||scenes[idx].type==='recap'?100:0);
    fill.style.width = pct+'%';
  }
}

function generateCertificate(nom, pct, correct, total){
  const W = 1600, H = 1300; // format agrandi pour accueillir un logo plus grand
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  function drawRestAndDownload(){
    // Fond
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0,0,W,H);

    // Bandeau supérieur — charte Connecteo
    ctx.fillStyle = '#096475';
    ctx.fillRect(0,0,W,26);
    ctx.fillStyle = '#00AFA9';
    ctx.fillRect(0,26,W,10);

    // Bordure décorative
    ctx.strokeStyle = '#CCE1E1';
    ctx.lineWidth = 3;
    ctx.strokeRect(50,80,W-100,H-160);

    // Icônes de célébration (uniquement si le seuil de réussite est atteint)
    if(pct >= PASS_THRESHOLD){
      ctx.font = '130px "Segoe UI Emoji","Noto Color Emoji","Apple Color Emoji",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🎉', 190, 660);
      ctx.fillText('🏆', W-190, 660);
    }

    // Logo Connecteo — encore agrandi
    const logoSize = 280;
    if(window.__logoImg){
      ctx.drawImage(window.__logoImg, W/2-logoSize/2, 100, logoSize, logoSize);
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#657C8A';
    ctx.font = '600 20px Mada, sans-serif';
    ctx.fillText('DÉPARTEMENT FORMATION', W/2, 425);

    ctx.fillStyle = '#096475';
    ctx.font = '800 56px Mada, sans-serif';
    ctx.fillText('Certificat de réussite', W/2, 505);

    ctx.strokeStyle = '#FFA900';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(W/2-130,535); ctx.lineTo(W/2+130,535); ctx.stroke();

    ctx.fillStyle = '#657C8A';
    ctx.font = '500 24px Mada, sans-serif';
    ctx.fillText('Ce certificat est décerné à', W/2, 590);

    ctx.fillStyle = '#7200A9';
    ctx.font = '700 48px Mada, sans-serif';
    ctx.fillText(nom, W/2, 655);

    ctx.fillStyle = '#657C8A';
    ctx.font = '500 24px Mada, sans-serif';
    ctx.fillText('pour avoir complété le module de sensibilisation', W/2, 705);

    ctx.fillStyle = '#096475';
    ctx.font = '700 48px Mada, sans-serif';
    ctx.fillText('RGPD & Protection des données', W/2, 768);

    // Score
    ctx.fillStyle = '#EEF1E5';
    ctx.beginPath();
    ctx.arc(W/2, 940, 100, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#78844A';
    ctx.font = '800 52px Mada, sans-serif';
    ctx.fillText(pct+'%', W/2, 955);
    ctx.font = '500 20px Mada, sans-serif';
    ctx.fillText(correct+'/'+total+' bonnes réponses', W/2, 985);

    // Date
    const dateStr = new Date().toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });
    ctx.fillStyle = '#657C8A';
    ctx.font = '500 22px Mada, sans-serif';
    ctx.fillText('Délivré le '+dateStr, W/2, 1110);

    ctx.font = 'italic 400 16px Mada, sans-serif';
    ctx.fillStyle = '#A49382';
    ctx.fillText('Document généré automatiquement — vaut attestation de passage du module', W/2, H-100);

    const link = document.createElement('a');
    link.download = 'Certificat_RGPD_'+nom.replace(/[^a-zA-Z0-9]+/g,'_')+'.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  if(window.__logoImg){
    drawRestAndDownload();
  } else {
    const img = new Image();
    img.onload = ()=>{ window.__logoImg = img; drawRestAndDownload(); };
    img.onerror = ()=>{ window.__logoImg = null; drawRestAndDownload(); };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(LOGO_SVG_MARKUP)));
  }
}

function arraysMatchAsSets(a, b){
  if(!Array.isArray(a) || !Array.isArray(b)) return false;
  if(a.length!==b.length) return false;
  const sa = new Set(a);
  return b.every(v=>sa.has(v));
}

function answerQuiz(picked){
  const s = scenes[idx];
  const correct = s.multi ? arraysMatchAsSets(picked, s.correct) : picked===s.correct;
  answers[idx] = {picked, correct};
  showQuizResult(mainEl, s, picked);
  const btnValidate = mainEl.querySelector('#btnValidate');
  if(btnValidate) btnValidate.style.display='none';
  stopQuizTimer();
  const qTimerEl = mainEl.querySelector('#qTimer');
  if(qTimerEl) qTimerEl.style.display='none';
  updateFooter();
  saveProgress();
}

function showQuizResult(container, s, picked){
  const opts = container.querySelectorAll('.opt');
  if(s.multi){
    const correctSet = new Set(s.correct);
    const pickedSet = new Set(picked||[]);
    opts.forEach((b,i)=>{
      b.disabled = true;
      if(correctSet.has(i)) b.classList.add('correct');
      else if(pickedSet.has(i)) b.classList.add('wrong');
    });
    const fb = container.querySelector('#fb');
    const ok = arraysMatchAsSets(picked||[], s.correct);
    fb.className = 'feedback show '+(ok?'ok':'ko');
    fb.textContent = ok ? s.feedbackOk : s.feedbackKo;
  } else {
    opts.forEach((b,i)=>{
      b.disabled = true;
      if(i===s.correct) b.classList.add('correct');
      else if(i===picked) b.classList.add('wrong');
    });
    const fb = container.querySelector('#fb');
    const ok = picked===s.correct;
    fb.className = 'feedback show '+(ok?'ok':'ko');
    fb.textContent = ok ? s.feedbackOk : s.feedbackKo;
  }
}

function updateFooter(){
  btnBack.style.visibility = idx===0 ? 'hidden':'visible';
  const s = scenes[idx];
  if(s.type==='quiz' && answers[idx]===undefined){
    btnNext.disabled = true;
    btnNext.textContent = 'Répondez pour continuer';
  } else if(s.type==='identity' && !participantIdentity){
    btnNext.disabled = true;
    btnNext.textContent = 'Complétez vos informations';
  } else {
    btnNext.disabled = false;
    btnNext.textContent = idx===scenes.length-1 ? 'Terminer ✓' : 'Suivant →';
  }
  const contentScenes = scenes.filter(x=>x.type!=='intro'&&x.type!=='identity'&&x.type!=='recap').length;
  let posInContent = 0;
  for(let i=0;i<=idx;i++){ if(scenes[i].type!=='intro'&&scenes[i].type!=='identity'&&scenes[i].type!=='recap') posInContent++; }
  stepCount.textContent = (s.type==='intro') ? 'Introduction' : (s.type==='identity') ? 'Identification' : (s.type==='recap') ? 'Bilan final' : `Étape ${posInContent} / ${contentScenes}`;
}

btnNext.onclick = ()=>{
  if(idx<scenes.length-1){ idx++; render(); saveProgress(); window.scrollTo({top:0,behavior:'smooth'}); }
};
btnBack.onclick = ()=>{
  if(idx>0){ idx--; render(); saveProgress(); window.scrollTo({top:0,behavior:'smooth'}); }
};

loadProgress(); // reprend une session en cours si l'onglet a été rafraîchi
render();
</script>
</body>
</html>

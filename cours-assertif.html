<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La communication assertive</title>
<link href="https://fonts.googleapis.com/css2?family=Mada:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
    --primary:#00afa9;
    --primary-light:#cce1e1;
    --primary-dark:#096475;
    --secondary-purple:#7200a9;
    --secondary-orange:#ffa900;
    --success:#27ae60;
    --error:#e74c3c;
    --gray:#808284;
    --gray-light:#f5f7f8;
    --gray-dark:#4a4a4a;
    --white:#ffffff;
    --shadow:0 4px 12px rgba(0,0,0,0.08);
    --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Mada',sans-serif;
    background:var(--gray-light);
    color:var(--gray-dark);
    line-height:1.6;
    height:100vh;
    overflow:hidden;
}
.topbar{
    background:var(--primary-dark);
    color:#fff;
    padding:14px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    height:60px;
}
.topbar a{color:#fff;text-decoration:none;font-weight:700;}
.topbar .title{font-weight:700;font-size:0.95rem;letter-spacing:0.03em;}
.topbar .progress-text{font-size:0.85rem;opacity:0.9;}

.layout{
    display:flex;
    height:calc(100vh - 60px);
}

/* SIDEBAR */
.sidebar{
    width:280px;
    background:var(--primary-dark);
    color:#fff;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
}
.sidebar-head{
    padding:20px 24px;
    border-bottom:1px solid rgba(255,255,255,0.15);
    font-size:0.75rem;
    font-weight:800;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--primary-light);
}
.sidebar-menu{flex:1;padding:12px;}
.sidebar-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:0.9rem;
    font-weight:600;
    color:rgba(255,255,255,0.75);
    margin-bottom:4px;
    transition:all 0.2s;
}
.sidebar-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
.sidebar-item.active{background:var(--primary);color:#fff;}
.sidebar-item .num{
    width:26px;height:26px;border-radius:50%;
    background:rgba(255,255,255,0.15);
    display:flex;align-items:center;justify-content:center;
    font-size:0.75rem;font-weight:800;flex-shrink:0;
}
.sidebar-item.done .num{background:var(--success);}
.sidebar-item.active .num{background:rgba(255,255,255,0.3);}

/* MAIN */
.main{
    flex:1;
    overflow-y:auto;
    padding:40px 60px;
    position:relative;
}
.scene{
    max-width:820px;
    margin:0 auto;
    animation:fadeIn 0.4s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.eyebrow{
    display:inline-block;
    background:var(--primary-light);
    color:var(--primary-dark);
    padding:5px 14px;
    border-radius:20px;
    font-size:0.72rem;
    font-weight:800;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-bottom:15px;
}
h1{font-size:2rem;font-weight:900;color:var(--primary-dark);margin-bottom:18px;line-height:1.2;}
h2{font-size:1.4rem;font-weight:800;color:var(--primary-dark);margin-bottom:15px;}
p{font-size:1.05rem;line-height:1.7;margin-bottom:15px;}
.lede{font-size:1.1rem;line-height:1.7;margin-bottom:20px;}

.card{
    background:var(--white);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:24px 28px;
    margin:20px 0;
}
.card-title{font-weight:800;color:var(--primary-dark);margin-bottom:10px;font-size:1.05rem;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0;}
@media (max-width:768px){.grid2{grid-template-columns:1fr;}}

.pill{
    background:var(--gray-light);
    border-radius:10px;
    padding:16px 18px;
    border-left:4px solid var(--primary);
}
.pill.good{border-left-color:var(--success);}
.pill.warn{border-left-color:var(--error);}
.pill .pill-title{font-weight:800;margin-bottom:6px;font-size:0.95rem;}
.pill.good .pill-title{color:var(--success);}
.pill.warn .pill-title{color:var(--error);}
.pill p{margin:0;font-size:0.9rem;color:var(--gray);}

.quote{
    background:var(--primary-light);
    border-left:4px solid var(--primary);
    border-radius:10px;
    padding:16px 20px;
    font-style:italic;
    color:var(--primary-dark);
    margin:20px 0;
    font-size:1rem;
}

/* Flip card */
.flip-container{perspective:1000px;margin:15px 0;cursor:pointer;}
.flip-card{position:relative;height:140px;transition:transform 0.6s;transform-style:preserve-3d;}
.flip-container.flipped .flip-card{transform:rotateY(180deg);}
.flip-front,.flip-back{
    position:absolute;inset:0;backface-visibility:hidden;
    border-radius:12px;display:flex;align-items:center;justify-content:center;
    padding:20px;text-align:center;font-weight:700;
}
.flip-front{background:linear-gradient(135deg, var(--primary), var(--primary-dark));color:#fff;font-size:1.1rem;}
.flip-back{background:var(--white);color:var(--gray-dark);transform:rotateY(180deg);font-weight:500;font-size:0.95rem;box-shadow:var(--shadow);}

/* Quiz */
.quiz-box{background:var(--gray-light);border-radius:12px;padding:24px;margin-top:20px;}
.quiz-q{font-weight:800;color:var(--primary-dark);margin-bottom:14px;font-size:1.05rem;}
.quiz-opt{
    display:block;background:var(--white);padding:14px 18px;border-radius:8px;margin-bottom:8px;
    cursor:pointer;border:2px solid transparent;transition:all 0.2s;font-size:0.95rem;
    font-family:'Mada',sans-serif;width:100%;text-align:left;
}
.quiz-opt:hover{border-color:var(--primary);}
.quiz-opt.correct{background:#e8f8ef;border-color:var(--success);color:#1e5b3b;font-weight:700;}
.quiz-opt.wrong{background:#fbe9e7;border-color:var(--error);color:#7c2a20;}

.btn{
    display:inline-block;
    padding:12px 24px;
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:8px;
    font-weight:700;
    font-size:1rem;
    font-family:'Mada',sans-serif;
    cursor:pointer;
    transition:all 0.2s;
}
.btn:hover{background:var(--primary-dark);}
.btn:disabled{background:#ccc;cursor:not-allowed;}

/* Navigation bas */
.nav-bar{
    position:sticky;bottom:0;
    background:var(--white);
    border-top:1px solid #eef2f4;
    padding:14px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:30px -60px -40px -60px;
}
.nav-progress{flex:1;max-width:300px;height:8px;background:var(--primary-light);border-radius:4px;overflow:hidden;margin:0 20px;}
.nav-progress > div{height:100%;background:var(--primary);border-radius:4px;transition:width 0.4s;}

/* Certificat */
.cert{
    background:var(--white);
    border:3px solid var(--primary-dark);
    border-radius:12px;
    padding:40px;
    text-align:center;
    max-width:600px;
    margin:30px auto;
    position:relative;
}
.cert::before{content:'';position:absolute;inset:10px;border:1px solid var(--primary-light);border-radius:8px;pointer-events:none;}
.cert h2{font-size:1.8rem;font-weight:900;color:var(--primary-dark);margin-bottom:10px;}
.cert .name{font-size:1.5rem;font-weight:800;color:var(--secondary-purple);margin:20px 0;}
.cert .badge{width:80px;height:80px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px;color:#fff;}
</style>
</head>
<body>

<header class="topbar">
    <a href="index.html">← Retour</a>
    <span class="title">La communication assertive</span>
    <span class="progress-text" id="progressText">0%</span>
</header>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-head">Sommaire</div>
        <div class="sidebar-menu" id="sidebarMenu"></div>
    </aside>

    <main class="main" id="main">
        <!-- Contenu injecté par JS -->
    </main>
</div>

<script>
// ============================================
// CONFIGURATION SUPABASE
// ============================================
const SUPABASE_URL = "https://txdvluhigwkyrduqxmyr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4ZHZsdWhpZ3dreXJkdXF4bXlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMTYzMzEsImV4cCI6MjEwMjg5MjMzMX0.waXh6ptcSMocNPJMbF36IPGIH4E-EGdTvj9NwGoiSV0";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ⚠️ ID du cours en base — À REMPLACER par l'id réel après insertion SQL
const COURS_ID = 6;

// ============================================
// CONTENU DU COURS
// ============================================
const scenes = [
    {
        id: 'intro',
        title: 'Introduction',
        type: 'content',
        content: `
            <span class="eyebrow">Module 1 · Introduction</span>
            <h1>La communication assertive</h1>
            <p class="lede">S'exprimer avec clarté, respect et fermeté — sans agressivité ni passivité. C'est la promesse de l'assertivité, une compétence clé pour tout professionnel.</p>
            <div class="card">
                <div class="card-title">🎯 Ce que vous allez apprendre</div>
                <ul style="padding-left:20px;line-height:2;">
                    <li>Différencier comportement passif, agressif et assertif</li>
                    <li>Utiliser la méthode DESC pour formuler une critique constructive</li>
                    <li>Dire non sans culpabiliser</li>
                    <li>Recevoir un feedback difficile</li>
                </ul>
            </div>
        `
    },
    {
        id: 'principe',
        title: 'Principe de l\'assertivité',
        type: 'content',
        content: `
            <span class="eyebrow">Module 2 · Principe</span>
            <h1>Qu'est-ce que l'assertivité ?</h1>
            <p>L'assertivité est la capacité à <b>exprimer ses besoins, opinions et émotions</b> de manière directe, honnête et respectueuse, tout en respectant ceux des autres.</p>
            <div class="quote">
                « L'assertivité, c'est dire ce que je pense sans écraser l'autre et sans m'écraser moi-même. »
            </div>
            <p>Ni passif (je subis), ni agressif (j'impose), mais assertif (je m'exprime).</p>
        `
    },
    {
        id: 'trois-comportements',
        title: 'Les 3 comportements',
        type: 'content',
        content: `
            <span class="eyebrow">Module 3 · Comparaison</span>
            <h1>Passif, agressif ou assertif ?</h1>
            <p>Cliquez sur chaque carte pour découvrir le comportement associé.</p>
            <div class="flip-container" onclick="this.classList.toggle('flipped')">
                <div class="flip-card">
                    <div class="flip-front">Comportement passif</div>
                    <div class="flip-back">« Je ne dis rien, je laisse faire. »<br><br>Le passif évite le conflit au prix de ses propres besoins. Il subit, se plaint, mais n'agit pas.</div>
                </div>
            </div>
            <div class="flip-container" onclick="this.classList.toggle('flipped')">
                <div class="flip-card">
                    <div class="flip-front">Comportement agressif</div>
                    <div class="flip-back">« C'est comme ça et pas autrement. »<br><br>L'agressif impose ses besoins sans considération pour l'autre. Il gagne une bataille mais perd la relation.</div>
                </div>
            </div>
            <div class="flip-container" onclick="this.classList.toggle('flipped')">
                <div class="flip-card">
                    <div class="flip-front">Comportement assertif</div>
                    <div class="flip-back">« Voici mon point de vue, qu'en penses-tu ? »<br><br>L'assertif exprime ses besoins tout en respectant ceux de l'autre. Il construit une relation durable.</div>
                </div>
            </div>
        `
    },
    {
        id: 'methode-desc',
        title: 'La méthode DESC',
        type: 'content',
        content: `
            <span class="eyebrow">Module 4 · Outil pratique</span>
            <h1>La méthode DESC</h1>
            <p>Un outil simple pour formuler une critique ou une demande difficile sans blesser :</p>
            <div class="grid2">
                <div class="pill">
                    <div class="pill-title">D — Décrire</div>
                    <p>Décrivez les faits, sans jugement.</p>
                </div>
                <div class="pill">
                    <div class="pill-title">E — Exprimer</div>
                    <p>Exprimez votre ressenti avec "je".</p>
                </div>
                <div class="pill">
                    <div class="pill-title">S — Suggérer</div>
                    <p>Proposez une solution concrète.</p>
                </div>
                <div class="pill">
                    <div class="pill-title">C — Conclure</div>
                    <p>Concluez sur un bénéfice commun.</p>
                </div>
            </div>
            <div class="card">
                <div class="card-title">💡 Exemple concret</div>
                <p style="margin:0;"><b>Au lieu de :</b> « Tu es toujours en retard, c'est inadmissible. »<br><br>
                <b>Dites :</b> « Ce matin, la réunion a commencé 15 minutes en retard (D). Je me suis senti gêné vis-à-vis du client (E). Est-ce qu'on pourrait décaler à 9h30 pour que tu puisses être là ? (S). Ça nous permettrait de démarrer sereinement (C). »</p>
            </div>
        `
    },
    {
        id: 'quiz',
        title: 'Quiz final',
        type: 'quiz',
        content: `
            <span class="eyebrow">Évaluation</span>
            <h1>Quiz de validation</h1>
            <p>Répondez aux 3 questions ci-dessous. Score minimum : <b>2/3 (67%)</b> pour valider.</p>
            <div id="quizContainer"></div>
            <button class="btn" id="btnValidateQuiz" style="margin-top:20px;" disabled>Valider mes réponses</button>
            <p id="quizResult" style="margin-top:20px;font-weight:700;"></p>
        `
    }
];

// Quiz
const quizQuestions = [
    {
        question: "Quel comportement consiste à exprimer ses besoins tout en respectant ceux des autres ?",
        options: ["Passif", "Agressif", "Assertif"],
        correct: 2
    },
    {
        question: "Dans la méthode DESC, que signifie le S ?",
        options: ["Silence", "Suggérer une solution", "Subir", "Supporter"],
        correct: 1
    },
    {
        question: "Un manager qui dit 'C'est comme ça et pas autrement' adopte un comportement :",
        options: ["Passif", "Agressif", "Assertif"],
        correct: 1
    }
];

// ============================================
// ÉTAT
// ============================================
let currentIndex = 0;
const sceneDone = {};

// ============================================
// RENDU
// ============================================
function renderSidebar() {
    const menu = document.getElementById('sidebarMenu');
    menu.innerHTML = '';
    scenes.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = 'sidebar-item';
        if (i === currentIndex) div.classList.add('active');
        if (sceneDone[s.id]) div.classList.add('done');
        div.innerHTML = `<span class="num">${sceneDone[s.id] ? '✓' : (i+1)}</span> ${s.title}`;
        div.onclick = () => goTo(i);
        menu.appendChild(div);
    });
}

function renderScene() {
    const scene = scenes[currentIndex];
    const main = document.getElementById('main');
    let content = `<div class="scene">${scene.content}</div>`;

    if (scene.type === 'quiz') {
        content += `<div class="nav-bar">
            <button class="btn btn-secondary" onclick="goTo(${currentIndex - 1})">← Précédent</button>
            <div class="nav-progress"><div style="width:${(currentIndex)/(scenes.length-1)*100}%"></div></div>
            <button class="btn" disabled>Terminer</button>
        </div>`;
    } else {
        content += `<div class="nav-bar">
            <button class="btn btn-secondary" onclick="goTo(${currentIndex - 1})" ${currentIndex === 0 ? 'disabled' : ''}>← Précédent</button>
            <div class="nav-progress"><div style="width:${(currentIndex)/(scenes.length-1)*100}%"></div></div>
            <button class="btn" onclick="goTo(${currentIndex + 1})">Suivant →</button>
        </div>`;
    }

    main.innerHTML = content;
    document.getElementById('progressText').textContent = Math.round(((currentIndex + 1) / scenes.length) * 100) + '%';

    if (scene.type === 'quiz') initQuiz();
    renderSidebar();
}

function goTo(index) {
    if (index < 0 || index >= scenes.length) return;
    if (index > currentIndex) sceneDone[scenes[currentIndex].id] = true;
    currentIndex = index;
    renderScene();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================
// QUIZ
// ============================================
let quizAnswers = {};
let quizScore = 0;

function initQuiz() {
    quizAnswers = {};
    quizScore = 0;
    const container = document.getElementById('quizContainer');
    container.innerHTML = '';

    quizQuestions.forEach((q, qIndex) => {
        const box = document.createElement('div');
        box.className = 'quiz-box';
        let html = `<div class="quiz-q">${qIndex + 1}. ${q.question}</div>`;
        q.options.forEach((opt, oIndex) => {
            html += `<button class="quiz-opt" data-q="${qIndex}" data-o="${oIndex}" onclick="selectAnswer(${qIndex}, ${oIndex})">${opt}</button>`;
        });
        box.innerHTML = html;
        container.appendChild(box);
    });

    document.getElementById('btnValidateQuiz').disabled = true;
    document.getElementById('btnValidateQuiz').onclick = validateQuiz;
}

function selectAnswer(qIndex, oIndex) {
    quizAnswers[qIndex] = oIndex;
    document.querySelectorAll(`button[data-q="${qIndex}"]`).forEach(btn => {
        btn.classList.remove('correct', 'wrong');
        if (parseInt(btn.dataset.o) === oIndex) btn.style.borderColor = 'var(--primary)';
        else btn.style.borderColor = 'transparent';
    });
    document.getElementById('btnValidateQuiz').disabled = Object.keys(quizAnswers).length < quizQuestions.length;
}

function validateQuiz() {
    quizScore = 0;
    quizQuestions.forEach((q, qIndex) => {
        const selected = quizAnswers[qIndex];
        document.querySelectorAll(`button[data-q="${qIndex}"]`).forEach(btn => {
            const oIndex = parseInt(btn.dataset.o);
            btn.disabled = true;
            btn.style.borderColor = 'transparent';
            if (oIndex === q.correct) btn.classList.add('correct');
            else if (oIndex === selected) btn.classList.add('wrong');
        });
        if (selected === q.correct) quizScore++;
    });

    const percent = Math.round((quizScore / quizQuestions.length) * 100);
    const passed = percent >= 67;

    document.getElementById('quizResult').textContent = `Score : ${quizScore}/${quizQuestions.length} (${percent}%)`;
    document.getElementById('quizResult').style.color = passed ? 'var(--success)' : 'var(--error)';

    document.getElementById('btnValidateQuiz').disabled = true;

    if (passed) {
        saveProgressToSupabase(percent);
        showCertificate(percent);
    } else {
        setTimeout(() => {
            alert('Score insuffisant. Revoyez le module et réessayez.');
            goTo(0);
        }, 1500);
    }
}

// ============================================
// SAUVEGARDE PROGRESSION
// ============================================
async function saveProgressToSupabase(percent) {
    const sessionUser = JSON.parse(localStorage.getItem('sessionUser') || 'null');
    if (!sessionUser) return;
    const { error } = await supabaseClient.from('progress').upsert({
        user_id: sessionUser.username,
        course_id: COURS_ID,
        completed: true,
        score: percent,
        completed_at: new Date().toISOString()
    }, { onConflict: 'user_id,course_id' });
    if (error) console.error('Erreur sauvegarde:', error);
}

// ============================================
// CERTIFICAT
// ============================================
function showCertificate(percent) {
    const sessionUser = JSON.parse(localStorage.getItem('sessionUser') || 'null');
    const userName = sessionUser ? sessionUser.name : 'Apprenant';
    const dateStr = new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });

    document.getElementById('main').innerHTML = `
        <div class="scene">
            <div class="cert">
                <div class="badge">🏆</div>
                <small style="color:var(--gray);font-weight:700;letter-spacing:0.05em;text-transform:uppercase;">Département Formation</small>
                <h2>Certificat de réussite</h2>
                <div style="font-size:0.9rem;color:var(--gray);">Ce certificat est décerné à</div>
                <div class="name">${userName}</div>
                <div style="font-size:0.9rem;color:var(--gray);">pour avoir complété le module</div>
                <div style="font-weight:800;color:var(--primary-dark);margin:10px 0;">La communication assertive</div>
                <div style="display:inline-block;background:#e8f8ef;color:#1e5b3b;padding:8px 20px;border-radius:20px;font-weight:800;margin:15px 0;">
                    ${percent}% · ${quizScore}/3 bonnes réponses
                </div>
                <div style="color:var(--gray);font-size:0.85rem;margin-top:10px;">Délivré le ${dateStr}</div>
            </div>
            <div style="text-align:center;margin-top:30px;">
                <a href="index.html#catalogue" class="btn">← Retour au catalogue</a>
            </div>
        </div>
    `;
    document.getElementById('progressText').textContent = '100%';
}

// ============================================
// INIT
// ============================================
renderScene();
</script>

</body>
</html>
